name: Deploy English Exam Platform to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore migrated source
        run: |
          cat .source/payload.* | base64 -d > /tmp/english-exam-platform.tgz
          tar -xzf /tmp/english-exam-platform.tgz
      - name: Apply platform UX and security upgrade
        run: |
          cat .github/upgrade/patch.* | base64 -d | gzip -d > /tmp/platform-upgrade.patch
          patch -p1 < /tmp/platform-upgrade.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build static GitHub Pages site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
