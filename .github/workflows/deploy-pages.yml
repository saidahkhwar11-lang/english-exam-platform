name: Deploy English Exam Platform to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore migrated source
        run: |
          cat .source/payload.* | base64 -d > /tmp/english-exam-platform.tgz
          tar -xzf /tmp/english-exam-platform.tgz
      - name: Apply platform UX and security upgrade
        run: |
          cat .github/upgrade/patch.0* | base64 -d | gzip -d > /tmp/platform-upgrade.patch
          patch -p1 < /tmp/platform-upgrade.patch || true
          cat .github/upgrade/finalizer.0* | base64 -d | gzip -d > /tmp/finalize-ux-upgrade.py
          python /tmp/finalize-ux-upgrade.py
      - name: Apply student access and anti-cheating fixes
        run: python .github/scripts/patch-student-access-identity-anticheat.py
      - name: Apply real exam processor and full-content library
        run: |
          base64 -d .github/upgrade/exam-processor.b64 > /tmp/patch-exam-processor.py
          python /tmp/patch-exam-processor.py
      - name: Apply flexible exam structures
        run: python .github/scripts/patch-flexible-exam-structures.py
      - name: Apply Word table exam compatibility
        run: python .github/scripts/patch-docx-table-mcq.py
      - name: Apply question-only MCQ parser fix
        run: python .github/scripts/patch-question-only-mcq-parser.py
      - name: Apply authenticated Exam Library save fix
        run: python .github/scripts/patch-exam-library-save.py
      - name: Apply per-session exam content isolation
        run: python .github/scripts/patch-session-exam-content.py
      - name: Apply paginated tracker student loading
        run: python .github/scripts/patch-student-pagination.py
      - name: Apply Assessment Tracker teacher login compatibility
        run: python .github/scripts/patch-tracker-teacher-login.py
      - name: Apply strict short written answer autocorrection
        run: python .github/scripts/patch-strict-short-answers.py
      - name: Apply automatic tracker assessment routing
        run: python .github/scripts/patch-tracker-assessment-routing.py
      - name: Sync maximum mark with Assessment Tracker column
        run: python .github/scripts/patch-tracker-max-mark-sync.py
      - name: Apply teacher logout and session type fix
        run: python .github/scripts/patch-teacher-logout-and-session-type.py
      - name: Apply spelling test student layout
        run: python .github/scripts/patch-spelling-test-layout.py
      - name: Apply universal answer-key parser and marking safeguards
        run: python .github/scripts/patch-universal-answer-key.py
      - name: Apply runtime-safe written-answer normalization
        run: python .github/scripts/patch-answer-normalizer-runtime.py
      - name: Defer marking until submit
        run: python .github/scripts/patch-score-on-submit-only.py
      - name: Apply student exam runtime guard
        run: python .github/scripts/patch-student-runtime-guard.py
      - name: Apply Basic and Advanced level differentiation
        run: python .github/scripts/patch-level-differentiation.py
      - name: Restore fullscreen after approved level change
        run: python .github/scripts/patch-level-change-fullscreen.py
      - name: Apply crash-safe submit flow
        run: python .github/scripts/patch-safe-submit-final.py
      - name: Apply post-submit feedback
        run: python .github/scripts/patch-submit-feedback.py
      - name: Apply PDF.js TypeScript compatibility fix
        run: python .github/scripts/patch-pdfjs-types.py
      - name: Apply Word MCQ import fix
        run: python .github/scripts/patch-mcq-word-import.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build static GitHub Pages site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
