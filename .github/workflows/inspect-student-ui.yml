name: Inspect exam processor source

on:
  push:
    paths:
      - '.github/workflows/inspect-student-ui.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore migrated source
        run: |
          cat .source/payload.* | base64 -d > /tmp/english-exam-platform.tgz
          tar -xzf /tmp/english-exam-platform.tgz
      - name: Apply current upgrade
        run: |
          cat .github/upgrade/patch.0* | base64 -d | gzip -d > /tmp/platform-upgrade.patch
          patch -p1 < /tmp/platform-upgrade.patch || true
          cat .github/upgrade/finalizer.0* | base64 -d | gzip -d > /tmp/finalize-ux-upgrade.py
          python /tmp/finalize-ux-upgrade.py
          python .github/scripts/patch-student-access-identity-anticheat.py
      - name: Print exam data and library excerpts
        run: |
          echo '--- types and exam constants ---'
          grep -n -C 12 -E 'type Exam|type Question|LEVELS|levelData|examData|questions|readingText|passage' app/page.tsx | head -n 500 || true
          echo '--- upload and new exam ---'
          grep -n -C 15 -E 'uploadedTestFileName|teacher-test-file-picker|startNewExam|Replace|Add Test File' app/page.tsx || true
          echo '--- exam library ---'
          grep -n -C 20 -E 'Exam Library|examLibrary|savedExam|saveExam|loadExam|duplicateExam|deleteExam' app/page.tsx || true
          echo '--- firebase refs ---'
          grep -n -C 8 -E 'firebase|databaseURL|set\(|get\(|update\(|teacherExam|library' app/page.tsx | head -n 500 || true
          echo '--- package ---'
          cat package.json
